<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found · rishi Jha - Professional GST and TDS Accountant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
        box-sizing: border-box;
      }
      .card {
        background-color: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 1.5rem;
        padding: 2rem;
        max-width: 440px;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .badge {
        display: inline-block;
        background-color: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.2);
        color: #10b981;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        text-transform: uppercase;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        margin: 0 0 0.5rem 0;
      }
      p {
        color: #94a3b8;
        font-size: 0.875rem;
        line-height: 1.5;
        margin: 0 0 1.5rem 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background-color: #10b981;
        color: #020617;
        font-weight: 700;
        font-size: 0.875rem;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }
      .btn:hover {
        background-color: #34d399;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">404 · Unrecorded Route</div>
      <h1>Page Not Found</h1>
      <p>The ledger record or financial dashboard path you requested does not exist or has been relocated.</p>
      <a href="/" class="btn">Return to Dashboard</a>
    </div>
  </body>
</html>
